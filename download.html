<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PDF書き込み君 | ダウンロード</title><style>body{margin:0;background:#f1f5f9;color:#26374c;font:16px -apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}header{padding:22px;background:#193c61;color:#fff}main{max-width:640px;margin:36px auto;background:#fff;border-radius:14px;padding:27px;box-shadow:0 5px 20px #0001}p{line-height:1.85}button{background:#176fad;color:#fff;border:0;border-radius:9px;padding:14px 20px;font:inherit;cursor:pointer}a{color:#176fad}footer{font-size:13px;color:#60758a;margin-top:30px}</style></head><body><header><h1>PDF書き込み君</h1></header><main><h2>オフライン版のダウンロード</h2><p>PDFにテキストを書き込み、別名で保存できます。HTMLファイルを保存すると、インターネット接続なしで動作します。PDFは外部に送信されません。</p><button id="download">HTMLアプリをダウンロード</button><p id="status" aria-live="polite"></p><p>すぐに試す場合は <a href="./index.html">アプリを開く</a> をご利用ください。</p><footer><a href="https://github.com/ken-tak-steam/pdf_kakikomikun/blob/main/LICENSE.md">ライセンス・著作権</a> ｜ <a href="https://github.com/ken-tak-steam/pdf_kakikomikun/blob/main/DISCLAIMER.md">免責事項</a></footer></main><script>document.getElementById("download").onclick=()=>{if(!confirm("PDF書き込み君（HTMLファイル）をダウンロードしますか？"))return;const a=document.createElement("a");a.href="./index.html";a.download="PDF書き込み君.html";document.body.appendChild(a);a.click();a.remove();document.getElementById("status").textContent="ダウンロードを開始しました。保存されない場合はアプリを開いて、ブラウザの「名前を付けて保存」をご利用ください。"};</script></body></html>
